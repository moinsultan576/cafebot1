<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CafeBot Staff Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --color-bg: #f4ede4;
      --color-header: #4b2e1e;
      --color-header-text: #fdf6ee;
      --color-card: #ffffff;
      --color-text: #3a2a1e;
      --color-border: #e0d3c2;
      --color-accent: #6f4e37;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      background: var(--color-header);
      color: var(--color-header-text);
    }

    header h1 {
      font-size: 18px;
      margin: 0;
    }

    #refresh-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: var(--color-accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    #refresh-btn:hover {
      opacity: 0.9;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    #empty-message,
    .error {
      color: #7a6a5c;
    }

    #orders-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .order-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .order-id {
      font-weight: 600;
      font-size: 14px;
    }

    .order-time {
      font-size: 12px;
      color: #8a7a6c;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
      background: #e0d3c2;
      color: var(--color-text);
    }

    .badge-confirmed { background: #ddeaf7; color: #1c4c78; }
    .badge-preparing { background: #fdf0c8; color: #7a5b00; }
    .badge-ready { background: #dcf3df; color: #1f6b2c; }
    .badge-completed { background: #e4e4e4; color: #555; }
    .badge-cancelled { background: #f8d7d7; color: #8a2323; }

    .order-items {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .order-fulfillment {
      font-size: 13px;
      color: #5a4a3c;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .order-total {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-row label {
      font-size: 13px;
      color: #5a4a3c;
    }

    .status-row select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>CafeBot — Staff Dashboard</h1>
    <button id="refresh-btn" type="button">Refresh</button>
  </header>

  <main>
    <p id="empty-message" hidden>No orders yet.</p>
    <div id="orders-list"></div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
